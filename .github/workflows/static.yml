# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Fix local asset paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          replacements = {
              r"C:\Users\MG\Downloads\JanaJony💖\elgamal.mp3": "elgamal.mp3",
              r"C:\Users\MG\Downloads\JanaJony💖\wayah.mp3": "wayah.mp3",
              r"C:\Users\MG\Downloads\JanaJony💖\Jana  .jpeg": "Jana  .jpeg",
              r"C:\Users\MG\Downloads\JanaJony💖\Jana .jpeg": "Jana .jpeg",
              r"C:\Users\MG\Downloads\JanaJony💖\Jana.jpeg": "Jana.jpeg",
              r"C:\Users\MG\Downloads\JanaJony💖\Jana Jony .jpg": "Jana Jony .jpg",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
